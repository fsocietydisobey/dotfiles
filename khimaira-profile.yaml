# Example khimaira profile — derived from the current laptop's setup.
# Drop this into your dotfiles repo as `khimaira-profile.yaml`, then:
#
#   khimaira bootstrap --profile https://raw.githubusercontent.com/<you>/dotfiles/main/khimaira-profile.yaml
#
# Or, after dotfiles are cloned:
#
#   khimaira bootstrap --profile ~/dotfiles/khimaira-profile.yaml
#
# Re-run `khimaira sync` on any machine to pick up profile changes
# (new symlinks, new MCP servers, etc.). Idempotent — safe on a cron.

name: fsocietydisobey
description: |
  Joseph's portable agent setup. Post-NORTH_STAR-Phase-0 (2026-05-13):
  seance/specter/scarlet/sibyl tools now ship inside the khimaira
  workspace at packages/{name}/ and re-register on khimaira's MCP at
  boot. The standalone clones of those siblings (still listed in repos:
  below) are no longer needed for the unified MCP — keeping them
  documented is OK if you want a quick reference checkout, but new
  machines can skip them. Only the khimaira repo itself is load-bearing
  for the MCP surface.

dotfiles:
  repo: git@github.com:fsocietydisobey/dotfiles.git
  path: ~/dotfiles
  symlinks:
    - { src: claude/CLAUDE.md, dest: ~/.claude/CLAUDE.md }
    - { src: claude/rules,     dest: ~/.claude/rules }
    - { src: claude/commands,  dest: ~/.claude/commands }
    - { src: claude/agents,    dest: ~/.claude/agents }
    - { src: codex/AGENTS.md,               dest: ~/.codex/AGENTS.md }
    - { src: codex/skills/khimaira-ask,     dest: ~/.codex/skills/khimaira-ask }
    - { src: codex/skills/khimaira-tell,    dest: ~/.codex/skills/khimaira-tell }
    - { src: codex/skills/khimaira-notes,   dest: ~/.codex/skills/khimaira-notes }
    # bin/roster launches the multi-window external roster (claude-chat +
    # kitty). Was a manual, machine-local symlink on the dev box only — never
    # captured here, so a fresh `khimaira bootstrap` (e.g. the backup laptop)
    # never got it and `roster` was missing from PATH. ~/bin is already on
    # PATH via .bashrc; apply_symlink creates it if absent.
    - { src: bin/roster,             dest: ~/bin/roster }
    - { src: bin/specter-test-chrome, dest: ~/bin/specter-test-chrome }
    # Add cursor symlinks here if/when you sync those too:
    # - { src: cursor/rules, dest: ~/.cursor/rules }

repos:
  - name: khimaira
    url: git@github.com:fsocietydisobey/khimaira.git
    # `--all-packages` is load-bearing: khimaira is a uv workspace and a
    # plain `uv sync` only installs the root project's deps, which drops
    # member-package entry-point scripts (notably `.venv/bin/khimaira`).
    # That breaks the khimaira MCP launcher on the next Claude Code
    # session start. --all-packages keeps every member's bin in place.
    install: uv sync --all-packages
  # Post-Phase-0 (2026-05-13): seance/specter/scarlet/sibyl standalone
  # clones at ~/dev/ are deprecated. Their tools now expose via khimaira's
  # unified MCP under prefixed names (mcp__khimaira__seance_*, etc.).
  # Removed from this profile so fresh-machine bootstrap doesn't clone
  # redundant trees + register them as standalone MCP servers.
  - name: ai-orchestrator
    url: git@github.com:fsocietydisobey/ai-orchestrator.git
    install: uv sync

mcp_servers:
  - name: khimaira
    # Use `python -m khimaira.cli mcp` (not bare `khimaira mcp`) so the
    # launcher survives the workspace-sync churn that can drop
    # .venv/bin/khimaira. `python` and the `khimaira` package are both
    # always present in the venv regardless of entry-point scripts.
    # This ONE entry surfaces khimaira native tools AND the prefixed
    # seance_*/specter_*/scarlet_*/sibyl_* tools (re-registered at boot
    # via khimaira.server.sibling_tools — see Phase 0 unification).
    command: uv --directory ~/dev/khimaira run python -m khimaira.cli mcp 2>>/tmp/khimaira.log
  - name: khimaira-chat
    # Real-time cross-session chat — separate lightweight MCP server from
    # khimaira's main tool surface. Registered on the primary machine but
    # missing from this profile until 2026-07-16 (found via a fresh-machine
    # demo: Claude Code on a synced laptop had khimaira but not khimaira-chat).
    command: uv --directory ~/dev/khimaira run khimaira-chat 2>>/tmp/khimaira-chat.log
  - name: ai-orchestrator
    command: uv --directory ~/dev/ai-orchestrator run ai-orchestrator 2>>/tmp/orchestrator.log
  - name: linear
    command: npx -y mcp-remote https://mcp.linear.app/mcp

supervisor:
  auto_install: true

spa_build: true

# Re-write ~/.claude/settings.json with khimaira's hooks on every
# bootstrap/sync. Lives outside dotfiles symlinks because hook command
# paths embed the local khimaira install path — symlinking from a
# fixed-path dotfiles copy would write wrong paths on machines whose
# username or install location differs.
install_claude_hooks: true

# Declaratively merge khimaira's MCP servers and lifecycle hooks into Codex
# (~/.codex/config.toml, ~/.codex/hooks.json). Same rationale as
# install_claude_hooks above — command paths are machine-local, so this is
# generated, not symlinked.
install_codex_adapter: true

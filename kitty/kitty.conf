# ---------------------------------------------------------
# SPACE GREY — Easy-on-eyes palette
# Background: warm mid-dark grey. Foreground: soft warm grey (not white).
# All terminal colors desaturated — readable without glare.
# Previous theme: VS Code Dark+ (kitty.conf.vscode.bak)
# ---------------------------------------------------------

font_family JetBrainsMono Nerd Font Mono
font_size 9.0

# ---------------------------------------------------------
# SPACE GREY — Color palette
# ---------------------------------------------------------

# Background & Transparency
background              #252528
background_opacity      1.0
dynamic_background_opacity yes

# Foreground / Text — warm grey, not white
foreground              #B0B4BF

# Selection
selection_foreground    #252528
selection_background    #6A7A90

# Cursor
cursor                  #8A9AAF
cursor_text_color       #252528

# URL underline color when hovering with mouse
url_color               #7A9AB8

# Window borders
active_border_color     #6A7A90
inactive_border_color   #3A3A42
bell_border_color       #B89A6A

# Tab bar — muted steel tones
active_tab_foreground   #E8ECF4
active_tab_background   #4A5A6A
inactive_tab_foreground #6A7080
inactive_tab_background #1E1E22
tab_bar_background      #1A1A1E

# Marks
mark1_foreground #252528
mark1_background #6A7A90
mark2_foreground #252528
mark2_background #7A6A90
mark3_foreground #252528
mark3_background #6A8A90

# Terminal colors (16-color palette) — all desaturated for low eye strain
# black
color0  #3A3A42
color8  #52525C

# red — muted rose, not neon
color1  #B06070
color9  #C07080

# green — sage, not lime
color2  #6A9870
color10 #7AAA80

# yellow — amber, not fluorescent
color3  #A89060
color11 #C0A870

# blue — steel blue
color4  #6080A0
color12 #7090B8

# magenta — dusty violet
color5  #8A70A0
color13 #9A80B0

# cyan — dusty teal
color6  #609090
color14 #70A8A0

# white
color7  #909098
color15 #A8ACBA

# ---------------------------------------------------------
# WINDOW LAYOUT
# ---------------------------------------------------------

window_padding_width 4

draw_minimal_borders yes
window_border_width 2pt
active_border_color   #6A7A90
inactive_border_color #3A3A42

# Inactive text alpha — dimmer inactive panes make the active one obvious
inactive_text_alpha 0.85

# Hide the OS Title Bar
linux_display_server wayland
hide_window_decorations yes

# Tiling Layout
enabled_layouts tall, grid, stack, splits, vertical


# ---------------------------------------------------------
# MANUAL SPLITTING (Requires the 'splits' layout)
# ---------------------------------------------------------

map ctrl+alt+h launch --location=hsplit --cwd=current
map ctrl+alt+v launch --location=vsplit --cwd=current
map ctrl+alt+s goto_layout splits
map ctrl+alt+d detach_window ask
map ctrl+alt+shift+d detach_tab ask


# ---------------------------------------------------------
# BROADCAST MODE
# ---------------------------------------------------------

allow_remote_control yes
listen_on unix:/tmp/kitty
map f11 launch --allow-remote-control kitty +kitten broadcast --match-tab state:focused
